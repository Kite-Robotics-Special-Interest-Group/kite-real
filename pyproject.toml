[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kite-real"
version = "0.1.0"
description = "Real-robot VLA research: recording, fine-tuning and visual robustness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kite Robotics Special Interest Group" }]
dependencies = ["numpy>=1.24", "pillow>=10.0"]

[project.optional-dependencies]
bench = ["kitebench"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
